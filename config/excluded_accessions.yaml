# Accessions permanently excluded from the ESKAPE ML pipeline.
# These genomes were downloaded during initial AB data collection but belong to the
# published Acinetobacter paper (Muthuraman et al. 2026, JAM) and must not be included
# in the ESKAPE ML training set. Including them would constitute data leakage.
#
# Sources:
#   - 23 from Supplementary_Data_S1.xlsx S2_Complete_Genome_Metadata (132 complete AB genomes)
#   - 7  from Supplementary_Data_S1.xlsx S3_IC2_Complete_Genomes (IC2 complete assemblies)
#   - 1  GCF_000189735.1: extra AB download not in paper supplementary; quarantined for consistency
#
# All 31 genome files + tool outputs moved to data/leaked_genomes/abaumannii/ (local only, gitignored).
# The Snakemake download_genome rule must skip any accession in this list.

