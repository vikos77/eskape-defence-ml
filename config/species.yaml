# ESKAPE species configuration
# Accession lists populated by src/features/build_accession_lists.py (Phase 2)
# Target: 150 complete genomes per species
# Quality gates: CheckM2 completeness >=95%, contamination <=5%
# Country cap: max 30 genomes per country per species

species:
  efaecium:
    name: "Enterococcus faecium"
    short: "Efm"
    gram: positive
    genome_size_mb_approx: 2.8
    target_n: 150
    country_cap: 30
    ncbi_taxids:
      - taxid: "1352"
        member: "E. faecium"
        sample_target: 150
    accessions: []   # populated by build_accession_lists.py

  saureus:
    name: "Staphylococcus aureus"
    short: "Sa"
    gram: positive
    genome_size_mb_approx: 2.8
    target_n: 150
    country_cap: 30
    ncbi_taxids:
      - taxid: "1280"
        member: "S. aureus"
        sample_target: 150
    accessions: []

  kpneumoniae:
    name: "Klebsiella pneumoniae"
    short: "Kp"
    gram: negative
    genome_size_mb_approx: 5.5
    target_n: 150
    country_cap: 30
    ncbi_taxids:
      - taxid: "573"
        member: "K. pneumoniae"
        sample_target: 150
    accessions: []

  abaumannii:
    name: "Acinetobacter baumannii"
    short: "Ab"
    gram: negative
    genome_size_mb_approx: 3.9
    target_n: 150
    country_cap: 30
    note: "Reference species — published data from Muthuraman et al. 2026 used as held-out validation set"
    ncbi_taxids:
      - taxid: "470"
        member: "A. baumannii"
        sample_target: 150
    accessions: []

  paeruginosa:
    name: "Pseudomonas aeruginosa"
    short: "Pa"
    gram: negative
    genome_size_mb_approx: 6.3
    target_n: 150
    country_cap: 30
    ncbi_taxids:
      - taxid: "287"
        member: "P. aeruginosa"
        sample_target: 150
    accessions: []

  ecloaceae:
    name: "Enterobacter cloacae complex"
    short: "Ec"
    gram: negative
    genome_size_mb_approx: 5.0
    target_n: 150
    country_cap: 30
    note: >
      Expanded from taxid 550 alone (142 genomes) to full E. cloacae complex
      (980 genomes across 6 genomospecies). Genomospecies recorded as metadata.
      Per-member sampling caps applied to prevent E. hormaechei domination.
    ncbi_taxids:
      - taxid: "158836"
        member: "E. hormaechei"
        sample_target: 60
      - taxid: "550"
        member: "E. cloacae"
        sample_target: 50
      - taxid: "61645"
        member: "E. asburiae"
        sample_target: 15
      - taxid: "208224"
        member: "E. kobei"
        sample_target: 10
      - taxid: "299767"
        member: "E. ludwigii"
        sample_target: 10
      - taxid: "1812935"
        member: "E. roggenkampii"
        sample_target: 5
    accessions: []
